<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="See where the sun falls on your Metro Vancouver yard, at any time of year." />
    <meta name="vanshade-build" content="%VITE_BUILD_SHA%" />
    <!-- No referrer policy here on purpose: the DataBC WFS only sends CORS headers when a Referer is present. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e8a33d'/%3E%3Cg stroke='%23e8a33d' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M16 2v4M16 26v4M2 16h4M26 16h4M6 6l3 3M23 23l3 3M6 26l3-3M23 9l3-3'/%3E%3C/g%3E%3C/svg%3E" />
    <title>VanShade</title>
  </head>
  <body>
    <header class="site-header">
      <h1 class="wordmark">VanShade</h1>
      <p class="tagline">Find the sunny and shady spots in your yard.</p>
    </header>

    <main>
      <form id="search-form" class="search" role="search" autocomplete="off" novalidate>
        <label for="address-input">Your address in Metro Vancouver</label>
        <div class="search-row">
          <div class="combobox">
            <input
              id="address-input"
              type="text"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="address-options"
              spellcheck="false"
              autocapitalize="off"
              placeholder="e.g. 453 W 12th Ave, Vancouver"
            />
            <ul id="address-options" role="listbox" aria-label="Address suggestions" hidden></ul>
          </div>
          <button type="submit">Find my lot</button>
        </div>
      </form>

      <ol id="status" class="status" aria-live="polite" hidden></ol>
      <div id="message" class="message" role="alert" hidden></div>

      <section id="lot" class="lot" aria-labelledby="lot-heading" hidden>
        <div class="lot-canvas-wrap">
          <canvas id="lot-canvas" role="img" aria-label="Outline of the lot, north at the top"></canvas>
        </div>
        <div class="lot-info">
          <h2 id="lot-heading"></h2>
          <dl id="lot-facts" class="facts"></dl>
          <ul id="lot-notices" class="notices"></ul>
          <fieldset id="lot-switcher" class="switcher" hidden>
            <legend>Not your lot? Other lots here</legend>
            <div id="lot-options"></div>
          </fieldset>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        Addresses from the BC Address Geocoder. Lot lines from ParcelMap BC: approximate, not a legal survey.
        Both under the
        <a href="https://www2.gov.bc.ca/gov/content?id=A519A56BC2BF44E4A008B33FCF527F61">Open Government Licence – British Columbia</a>.
      </p>
      <p class="build">Build <span id="build-sha">%VITE_BUILD_SHA%</span></p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
